name: publish

# Trusted publishing (OIDC): no npm token is stored in this repository. GitHub
# mints a short-lived token for this exact workflow, npm verifies it came from
# this repo and file, and then accepts the publish. Provenance is generated
# automatically for OIDC publishes, which is what n8n's Creator Portal expects.
#
# Setup, once: the trusted publisher lives on the package's own settings page on
# npmjs.com, so the package has to exist first. Version 0.1.0 was published by
# hand for that reason; from 0.1.1 on, this workflow is the only publisher.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required to mint the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in a release build

      # Node 22 still ships npm 10, which asks GitHub for an OIDC token only to
      # sign provenance and never trades it for publish rights. It fails with a
      # bare ENEEDAUTH or a 404 on PUT, so check the version up front instead.
      - name: Require an npm CLI that can publish over OIDC
        run: |
          version="$(npm --version)"
          echo "npm $version"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} cannot publish with trusted publishing, needs 11.5.1 or later`);
              process.exit(1);
            }
          ' "$version"

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match the package version $version" >&2
            exit 1
          fi

      - run: npm ci

      # prepublishOnly builds and tests, so a red test stops the publish before
      # the tarball exists. No token env var here: setting NODE_AUTH_TOKEN would
      # make npm use it and skip OIDC entirely.
      - name: Publish
        run: npm publish --access public
