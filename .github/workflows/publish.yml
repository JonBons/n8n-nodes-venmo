name: publish

# Publishing from CI with a provenance statement is required for n8n Creator
# Portal verification, and it also means a release is always built and tested
# from a clean checkout rather than a local machine.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match the package version $version" >&2
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs the build and the test suite, so a red test stops the
      # publish before the tarball is created.
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
